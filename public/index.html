<style>
:root{color-scheme:dark;--bg:#08121d;--ink:#f7fbff;--muted:#b2c8d8;--green:#7bf2c0;--border:#ffffff20;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
button,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}

#feed{height:100%;height:100dvh;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.slide{height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding:90px 24px max(104px,calc(env(safe-area-inset-bottom) + 88px));background:radial-gradient(ellipse at 100% 15%,#285f5a80,transparent 57%),linear-gradient(165deg,#132b38 0%,#08131f 68%,#12152a)}

<body>
<div class="shell" id="shell">
  <div id="feed"><div class="loading"><div><h1>⌘ Backend Quest</h1><p>Getting your bite-sized lessons ready…</p></div></div></div>
  <header class="app-top"><div class="top-row"><div class="logo">⌘ BACKEND <span>QUEST</span></div><div class="top-right"><button class="top-icon" id="savedBtn" aria-label="Show bookmarked lessons">♡ Saved</button><button class="top-icon" id="chaptersBtn">☰ Topics</button></div></div><div class="p-bar"><span id="topProgress"></span></div></header>
  <div class="app-bottom"><div class="bottom-meta" id="meta">Learn • Try • Explain</div><div class="lesson-progress"><div id="lessonProgress"></div></div><div class="bottom-row"><div class="swipe-hint"><button class="top-icon" id="prevBtn" aria-label="Previous card">↑ Back</button><span id="indexDisplay"></span></div><button class="next-btn" id="nextBtn">Next ↓</button></div></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Choose your learning topic"><div class="sheet-panel"><div class="sheet-top"><h2 id="sheetTitle">Your learning path</h2><button class="sheet-close" id="closeSheet" aria-label="Close topics">×</button></div><p class="sheet-tip" id="sheetTip">Swipe through a chapter, one simple idea at a time.</p><div id="sheetContent"></div></div></div>
</div>
<script>
"use strict";
const API="/lessons";
const KEY="backend-quest-swipe-v1";
const feed=document.getElementById("feed");
const shell=document.getElementById("shell");
const sheet=document.getElementById("sheet");
let lessons=[],modules=[],slides=[],active=0,selectedModule="all",observer=null;
let progress={answers:{},bookmarks:[],notes:{},completed:[],lastSlide:null,views:{}};
try{const read=JSON.parse(localStorage.getItem(KEY)||"{}");progress={...progress,...read}}catch{}
if(!progress.answers||typeof progress.answers!=="object")progress.answers={};
if(!Array.isArray(progress.bookmarks))progress.bookmarks=[];
if(!Array.isArray(progress.completed))progress.completed=[];
if(!progress.notes||typeof progress.notes!=="object")progress.notes={};
if(!progress.views||typeof progress.views!=="object")progress.views={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function splitText(value,max){
 const parts=String(value||"").trim().split(/(?<=[.!?])\s+/);
 const chunks=[];let buffer="";
 for(const sentence of parts){if((buffer+" "+sentence).length>max&&buffer){chunks.push(buffer);buffer=sentence}else buffer+=(buffer?" ":"")+sentence}
 if(buffer)chunks.push(buffer);
 return chunks.length?chunks:["Read the next step to understand this idea."];
}
function moduleName(id){const m=modules.find(x=>x.id===id);return m?m.title.replace(/^\d+\s*·\s*/,""):id}
function groupFor(id){return id==="orm"?"sql":id}
function buildSlides(){
 const selected=lessons.filter(l=>selectedModule==="all"||l.module===selectedModule||selectedModule==="saved"&&progress.bookmarks.includes(l.id));
 slides=[];
 for(const l of selected){
  const base={lessonId:l.id,lesson:l,group:groupFor(l.module)};
  slides.push({...base,id:l.id+":hook",kind:"hook",text:l.scenario,stage:"Real life"});
  splitText(l.explanation,270).forEach((part,i,all)=>slides.push({...base,id:l.id+":explain:"+i,kind:"explain",text:part,part:i+1,total:all.length,stage:"Learn"}));
  const lines=(l.code||"").split("\n");const per=9;
  for(let i=0;i<lines.length;i+=per)slides.push({...base,id:l.id+":code:"+Math.floor(i/per),kind:"code",code:lines.slice(i,i+per).join("\n"),part:Math.floor(i/per)+1,total:Math.ceil(lines.length/per),stage:"Code"});
  const walk=l.walk||[];
  for(let i=0;i<walk.length;i+=2)slides.push({...base,id:l.id+":walk:"+Math.floor(i/2),kind:"walk",steps:walk.slice(i,i+2),offset:i,part:Math.floor(i/2)+1,total:Math.ceil(walk.length/2),stage:"Understand"});
  slides.push({...base,id:l.id+":quiz",kind:"quiz",stage:"Your turn"});
  slides.push({...base,id:l.id+":apply",kind:"apply",stage:"Practice"});
  slides.push({...base,id:l.id+":recap",kind:"recap",stage:"Interview ready"});
 }
}
function lessonStage(s){return ["hook","explain","code","walk","quiz","apply","recap"].indexOf(s.kind)+1}
function stageName(s){return ["Problem","Concept","Code","Walkthrough","Quiz","Practice","Interview"][lessonStage(s)-1]}
function segmentLabel(s){return s.kind==="hook"?"01 · A real situation":s.kind==="explain"?"02 · THE EXPLANATION":s.kind==="code"?"03 · REAL CODE":s.kind==="walk"?"04 · STEP BY STEP":s.kind==="quiz"?"05 · CHOOSE YOUR ANSWER":s.kind==="apply"?"06 · PRACTICE": "07 · RECAP"}
function lessonPosition(l){return lessons.findIndex(x=>x.id===l.id)+1}
function makeSlide(s,i){
 const l=s.lesson;const saved=progress.bookmarks.includes(l.id);let content="";
 const title=l.title.replace(/^\d+\.\s*/,"");
 if(s.kind==="hook")content='<div class="pill">✦ '+esc(moduleName(l.module))+' · Lesson '+lessonPosition(l)+'</div><div class="eyebrow">Here is a real problem</div><h1 class="big-title">'+esc(title)+'</h1><p class="body-text">'+esc(s.text)+'</p><div class="card-panel"><b>What you will learn</b><p>You will practice this concept with code, a quick check and an interview answer.</p></div>';
 if(s.kind==="explain")content='<div class="eyebrow">Understand · '+s.part+'/'+s.total+'</div><h2 class="big-title concept-title">'+esc(s.part===1?l.topic:"Build the mental model")+'</h2><div class="concept-copy">'+s.text.split(/(?<=[.!?])\s+/).map((sentence,n)=>'<p class="'+(n===0?'lead-sentence':'detail-sentence')+'">'+esc(sentence)+'</p>').join("")+'</div><div class="memory-cue"><strong>Say it simply</strong><span>What is the main engineering idea here?</span></div>';
 if(s.kind==="code")content='<div class="eyebrow">Code example · '+s.part+'/'+s.total+'</div><h2 class="big-title concept-title">How it works in code</h2><pre class="code"><code>'+esc(s.code)+'</code></pre><p class="code-caption">Read each line slowly. Next, we explain exactly what the code is doing.</p>';
 if(s.kind==="walk")content='<div class="eyebrow">Step-by-step · '+s.part+'/'+s.total+'</div><h2 class="big-title concept-title">Trace the logic</h2>'+s.steps.map((step,j)=>'<div class="card-panel"><b>Step '+(s.offset+j+1)+'</b><p>'+esc(step)+'</p></div>').join('');
 if(s.kind==="quiz"){const a=progress.answers[l.id],pick=a?a.choice:-1;const why=a?(l.quiz.optionFeedback?.[a.choice]||l.quiz.feedback):"";content='<div class="eyebrow">Quick knowledge check</div><h2 class="big-title">'+esc(l.quiz.question)+'</h2><div class="quiz-options">'+l.quiz.answers.map((x,n)=>'<button class="opt '+(pick===n?'selected '+(pick===l.quiz.correct?'good':'bad'):'')+'" data-action="answer" data-lesson="'+esc(l.id)+'" data-choice="'+n+'"><span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+esc(x)+'</span></button>').join("")+'</div>'+(a?'<div class="feedback '+(a.correct?'':'bad')+'"><b>'+(a.correct?'✓ You got it!':'Not quite — this is how we learn.')+'</b>'+esc(why)+'</div><div class="card-panel"><b>Why this is the answer</b><p>'+esc(l.quiz.feedback)+'</p></div><button class="soft-btn" data-action="restudy" data-lesson="'+esc(l.id)+'">↶ Review the explanation</button><p class="feed-note">'+(a.correct?'Good work. You can scroll to try the exercise.':'Try another option if you like, or swipe to see the explanation.')+'</p>':'<p class="feed-note">Tap one answer. You get feedback immediately, no pressure.</p>')}
 if(s.kind==="apply")content='<div class="eyebrow">Your practice exercise</div><h2 class="big-title concept-title">Your interview answer</h2><p class="body-text">'+esc(l.exercise)+'</p><textarea class="note-input" rows="4" placeholder="Explain in your own words. It saves automatically…" aria-label="Your answer" data-action="note" data-lesson="'+esc(l.id)+'">'+esc(progress.notes[l.id]||"")+'</textarea><button class="soft-btn" data-action="reveal" data-lesson="'+esc(l.id)+'">Show explained answer ↓</button><div id="solution-'+esc(l.id)+'" hidden class="feedback"><b>One good answer</b>'+esc(l.solution)+'</div>';
 if(s.kind==="recap")content='<div class="eyebrow">Interview-ready recap</div><h2 class="big-title">Can you explain it aloud?</h2><div class="quote">'+esc(l.interview)+'</div><div class="card-panel"><b>One mistake to avoid</b><p>'+esc(l.warning)+'</p></div><button class="done-btn" data-action="complete" data-lesson="'+esc(l.id)+'">'+(progress.completed.includes(l.id)?'✓ Learned — keep going':'✓ I understand this lesson')+'</button><p class="feed-note">Speak this aloud in under 60 seconds, then mark the lesson complete.</p>';
 return '<article class="slide" data-index="'+i+'" data-id="'+esc(s.id)+'" data-group="'+esc(s.group)+'" aria-label="'+esc(s.stage+' · '+l.title)+'"><button class="slide-bookmark '+(saved?'saved':'')+'" data-action="bookmark" data-lesson="'+esc(l.id)+'" aria-label="'+(saved?'Remove saved lesson':'Save lesson for later')+'">'+(saved?'♥':'♡')+'</button><div class="slide-content" tabindex="0" role="region" aria-label="Lesson content: scroll to read"><div class="lesson-step"><span>'+esc(stageName(s))+'</span><span>'+lessonStage(s)+' of 7</span></div>'+content+'<div class="end-cue">↓ Swipe up for the next card</div></div></article>';
}
function render(targetId){
 buildSlides();
 if(!slides.length){feed.innerHTML='<div class="empty"><h2>No saved lessons yet</h2><p>Save a lesson with ♡ and it will appear here.</p><button class="answer-btn" data-action="all">Back to the feed</button></div>';updateTop();return}
 feed.innerHTML=slides.map(makeSlide).join("");
 if(observer)observer.disconnect();
 observer=new IntersectionObserver(function(entries){let best=null;for(const e of entries){if(e.isIntersecting&&(!best||e.intersectionRatio>best.intersectionRatio))best=e}if(best){const n=Number(best.target.dataset.index);if(n!==active){active=n;onActive()}}},{root:feed,threshold:[.5,.75,.95]});
 for(const el of feed.querySelectorAll(".slide"))observer.observe(el);
 const target=targetId?slides.findIndex(x=>x.id===targetId):0;
 active=Math.max(0,target);onActive();
 const targetEl=feed.querySelector('.slide[data-index="'+active+'"]');if(targetEl)feed.scrollTop=targetEl.offsetTop;
}
function updateTop(){
 document.getElementById("topProgress").style.width=slides.length?(((active+1)/slides.length)*100)+"%":"0%";
 const s=slides[active];document.getElementById("meta").textContent=s?moduleName(s.lesson.module)+" · "+s.lesson.title:"Your learning feed";
 document.getElementById("indexDisplay").textContent=slides.length?(active+1)+" / "+slides.length:"";
 const within=s?slides.filter(x=>x.lessonId===s.lessonId):[];
 const n=s?within.findIndex(x=>x.id===s.id):-1;
 document.getElementById("lessonProgress").style.width=within.length?((n+1)/within.length*100)+"%":"0%";
 document.getElementById("nextBtn").textContent=active>=slides.length-1?"Finished ✓":"Next ↓";
 const saved=selectedModule==="saved";document.getElementById("savedBtn").textContent=saved?"♥ Saved":"♡ Saved";
}
function onActive(){const s=slides[active];if(s){progress.lastSlide=s.id;progress.views[s.lessonId]=1;save()}updateTop()}
function goIndex(n){if(!slides.length)return;const idx=Math.max(0,Math.min(slides.length-1,n));feed.scrollTo({top:feed.querySelector('.slide[data-index="'+idx+'"]')?.offsetTop??idx*feed.clientHeight,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});active=idx;onActive()}
function openSheet(mode){const sc=document.getElementById("sheetContent");document.getElementById("sheetTitle").textContent="Choose what to learn";let html='<div class="progress-row"><span>Lessons understood</span><b>'+progress.completed.length+' / '+lessons.length+'</b></div><div class="progress-row"><span>Questions answered correctly</span><b>'+Object.values(progress.answers).filter(a=>a.correct).length+'</b></div><button class="chapter-row" data-action="module" data-module="all"><span>✨</span><div><strong>For You · All lessons</strong><small>Learn everything by scrolling</small></div></button>';
 for(const m of modules){const mLessons=lessons.filter(l=>l.module===m.id);const done=mLessons.filter(l=>progress.completed.includes(l.id)).length;html+='<button class="chapter-row" data-action="module" data-module="'+esc(m.id)+'"><span>▤</span><div><strong>'+esc(m.title)+'</strong><small>'+esc(m.description)+'</small><span class="chapter-count">'+done+'/'+mLessons.length+' completed</span></div></button>'}
 sc.innerHTML='<label class="small" for="topicSearch">Search your chapters</label><input id="topicSearch" class="nav-search" type="search" placeholder="TypeScript, security, SQL…" aria-label="Search chapters">'+html;sheet.hidden=false;document.getElementById("closeSheet").focus();
}
function closeSheet(){sheet.hidden=true;document.getElementById("chaptersBtn").focus()}
function selectModule(id){selectedModule=id;sheet.hidden=true;render();updateTop()}
function toggleBookmark(id){if(progress.bookmarks.includes(id))progress.bookmarks=progress.bookmarks.filter(x=>x!==id);else progress.bookmarks.push(id);save();if(selectedModule==="saved"){render();return}for(const b of feed.querySelectorAll('[data-action="bookmark"][data-lesson="'+id+'"]')){const saved=progress.bookmarks.includes(id);b.textContent=saved?'♥':'♡';b.classList.toggle("saved",saved);b.setAttribute("aria-label",saved?"Remove saved lesson":"Save lesson for later")}}
function answerQuiz(id,choice){const l=lessons.find(x=>x.id===id);if(!l)return;progress.answers[id]={choice,correct:choice===l.quiz.correct};save();const index=slides.findIndex(x=>x.id===id+":quiz");const el=feed.querySelector('.slide[data-index="'+index+'"]');if(!el)return;const rep=document.createElement("div");rep.innerHTML=makeSlide(slides[index],index);const newEl=rep.firstElementChild;el.replaceWith(newEl);observer.unobserve(el);observer.observe(newEl);onActive()}
function completeLesson(id){if(!progress.completed.includes(id))progress.completed.push(id);save();goIndex(active+1)}
feed.addEventListener("click",function(e){
 const b=e.target.closest("[data-action]");if(!b)return;
 const action=b.dataset.action,id=b.dataset.lesson;
 if(action==="answer")answerQuiz(id,Number(b.dataset.choice));
 if(action==="bookmark")toggleBookmark(id);
 if(action==="complete")completeLesson(id);
 if(action==="reveal"){const el=document.getElementById("solution-"+id);if(el){el.hidden=!el.hidden;b.textContent=el.hidden?"Show explained answer ↓":"Hide explanation ↑"}}
 if(action==="all")selectModule("all");if(action==="restudy"){const n=slides.findIndex(x=>x.id===id+":explain:0");if(n>=0)goIndex(n)}
});
feed.addEventListener("input",function(e){if(e.target.dataset.action==="note"){progress.notes[e.target.dataset.lesson]=e.target.value;save()}});
document.getElementById("nextBtn").addEventListener("click",()=>goIndex(active+1));document.getElementById("prevBtn").addEventListener("click",()=>goIndex(active-1));
document.getElementById("savedBtn").addEventListener("click",()=>selectModule(selectedModule==="saved"?"all":"saved"));
document.getElementById("chaptersBtn").addEventListener("click",()=>openSheet("topics"));
document.getElementById("closeSheet").addEventListener("click",closeSheet);
sheet.addEventListener("input",function(e){if(e.target.id==="topicSearch"){const term=e.target.value.trim().toLowerCase();for(const row of sheet.querySelectorAll(".chapter-row"))row.hidden=!row.textContent.toLowerCase().includes(term)}});sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();const b=e.target.closest("[data-action='module']");if(b)selectModule(b.dataset.module)});
document.addEventListener("keydown",function(e){if(!sheet.hidden){if(e.key==="Escape")closeSheet();return}if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();goIndex(active+1)}if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();goIndex(active-1)}});
async function boot(){
 try{
  const response=await fetch(API,{cache:"no-store"});if(!response.ok)throw Error("Lesson server returned "+response.status);
  const data=await response.json();if(!Array.isArray(data.lessons)||data.lessons.length<10||!Array.isArray(data.modules))throw Error("Lesson data incomplete");
  lessons=data.lessons;modules=data.modules;
  selectedModule="all";render(progress.lastSlide);
 }catch(error){
  feed.innerHTML='<div class="loading"><div><div class="eyebrow">Unable to load lessons</div><h1>We could not connect.</h1><p>'+esc(error.message||"Connection error")+'</p><button class="answer-btn" id="retry">Try again</button></div></div>';
  document.getElementById("retry").addEventListener("click",boot)
 }
}
boot();
</script>
</body>
